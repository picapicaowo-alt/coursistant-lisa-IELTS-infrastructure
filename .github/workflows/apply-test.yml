name: Deploy Tokyo test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-test-apply
  cancel-in-progress: false

jobs:
  apply:
    environment: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Write protected non-secret Terraform inputs
        env:
          TFVARS_JSON: ${{ secrets.TFVARS_JSON }}
        run: |
          test -n "$TFVARS_JSON"
          jq -e 'type == "object"' <<<"$TFVARS_JSON" >/dev/null
          printf '%s' "$TFVARS_JSON" > environments/test/ci.auto.tfvars.json

      - name: Terraform init
        working-directory: environments/test
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=coursistant-ielts/test/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        working-directory: environments/test
        run: terraform plan -input=false -out=test.tfplan

      - name: Terraform apply
        working-directory: environments/test
        run: terraform apply -input=false -auto-approve test.tfplan
